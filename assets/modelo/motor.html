    <meta charset="UTF-8" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1e1b2e; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1e1b2e; }

      /* ── Raul (60% de baixo) ──────────────────────────────── */
      #raul-janela { position: absolute; left: 0; top: 768px; width: 1080px; height: 1152px; overflow: hidden; }
      #raul-cam { position: absolute; inset: 0; transform-origin: 50% 32%; }
      #raul { position: absolute; inset: 0; width: 1080px; height: 1152px; object-fit: cover; }

      #grafico-fundo { position: absolute; left: 0; top: 768px; width: 1080px; height: 1152px; background: #1e1b2e; }
      #grafico { position: absolute; left: 0; top: 1040px; width: 1080px; height: 608px; object-fit: cover; }

      /* ── borda rasgada: sombra e fibra por baixo da folha ─── */
      #rasgo { position: absolute; left: 0; top: 0; width: 1080px; height: 1060px; pointer-events: none; }
      #rasgo-sombra { filter: blur(7px); opacity: 0.55; }

      /* ── a folha de cima: o mundo de papel ────────────────── */
      #topo { position: absolute; left: 0; top: 0; width: 1080px; height: 798px; overflow: hidden;
        background: #efe6d3 url(assets/papel.png) repeat; }
      #tremor { position: absolute; inset: 0; }
      #mundo { position: absolute; left: 0; top: 0; width: 32000px; height: 1300px; transform-origin: 0 0; will-change: transform; }
      #mesa { position: absolute; left: -6000px; top: -5000px; width: 46000px; height: 11000px; background: #efe6d3 url(assets/papel.png) repeat; }
      #grao {
        position: absolute; inset: 0; background: url(assets/grao.png) repeat;
        mix-blend-mode: overlay; opacity: 0.5; pointer-events: none;
      }
      #vinheta {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 45%, rgba(30, 27, 46, 0) 60%, rgba(30, 27, 46, 0.16) 100%);
      }
      .cena { position: absolute; top: 0; width: 1080px; height: 800px; }
      .o { position: absolute; will-change: transform; }
      .o > svg, .o > .b > svg { display: block; overflow: visible; }
      .som { filter: drop-shadow(0 7px 0 rgba(30, 27, 46, 0.16)) drop-shadow(0 16px 14px rgba(30, 27, 46, 0.14)); }
      .b { position: relative; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 700; color: #1e1b2e; letter-spacing: 0.02em; line-height: 1.2; }

      /* etiquetas, carimbos e números do mundo de papel */
      .tag { font-family: "Archivo Black", sans-serif; line-height: 1; text-align: center; white-space: nowrap; }
      .tag > span { display: inline-block; background: #f8f2e4; color: #1e1b2e; padding: 10px 18px 8px; border-radius: 5px;
        box-shadow: 0 5px 0 rgba(30, 27, 46, 0.22), 0 12px 16px rgba(30, 27, 46, 0.18); }
      .tagt > span { background: #1e1b2e; color: #f8f2e4; }
      .tagv > span { background: #e5432d; color: #f8f2e4; }
      .taga > span { background: #2c56a0; color: #f8f2e4; }
      .selo, .interro { font-family: "Archivo Black", sans-serif; line-height: 1; text-align: center; white-space: nowrap; color: #e5432d;
        -webkit-mask-image: url(assets/grao.png); mask-image: url(assets/grao.png); -webkit-mask-size: 260px; mask-size: 260px; }
      .selo > span { display: inline-block; border: 7px solid currentColor; border-radius: 12px; padding: 8px 20px 4px; }
      .seloa { color: #2c56a0; }
      .num { font-family: "Archivo Black", sans-serif; line-height: 1; text-align: center; color: #1e1b2e; }
      .rotl { font-family: "Archivo Black", sans-serif; line-height: 1.05; text-align: center; color: #1e1b2e; }

      /* aba de capítulo (fixa na tela, fora do mundo) */
      #hud { position: absolute; left: 0; top: 0; width: 1080px; height: 200px; pointer-events: none; }
      .cap { position: absolute; left: 24px; top: 22px; display: flex; align-items: stretch; transform-origin: 0 50%; }
      .cap span { font-family: "Archivo Black", sans-serif; line-height: 1; box-shadow: 0 5px 0 rgba(30, 27, 46, 0.25), 0 14px 18px rgba(30, 27, 46, 0.22); }
      .cap-n { background: #e5432d; color: #f8f2e4; font-size: 40px; padding: 12px 14px 8px; border-radius: 6px 0 0 6px; }
      .cap-n small { font-size: 22px; opacity: 0.8; }
      .cap-t { background: #f8f2e4; color: #1e1b2e; font-size: 32px; padding: 16px 20px 10px; border-radius: 0 6px 6px 0; }
      .cap-esp { background: #1e1b2e; color: #f8f2e4; border-radius: 6px; }

      /* ── legenda: etiqueta de papel na divisória ──────────── */
      #leg { position: absolute; left: 0; top: 698px; width: 1080px; height: 140px; pointer-events: none; }
      .etq {
        position: absolute; left: 50%; top: 50%; padding: 14px 34px 16px;
        background: #f8f2e4; border-radius: 6px; white-space: nowrap;
        box-shadow: 0 7px 0 rgba(30, 27, 46, 0.28), 0 18px 24px rgba(30, 27, 46, 0.25);
        font-family: "Archivo Black", sans-serif; color: #1e1b2e; line-height: 1;
        letter-spacing: -0.01em; text-transform: uppercase; opacity: 0;
      }
      .etq span { display: inline-block; }
    </style>

    <script>
      (function () {
        const D = window.DADOS;
        const DUR = 238.25;
        const C = {
          papel: "#efe6d3", claro: "#f8f2e4", kraft: "#d6c3a0", kraft2: "#bfa77d", tinta: "#1e1b2e",
          verm: "#e5432d", verm2: "#b9301f", azul: "#2c56a0", azul2: "#1f3f7a", rosa: "#f2a7a0", rosa2: "#e2857d",
          amar: "#e9b23a", amar2: "#c98f1c",
        };
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const mundo = $("#mundo");

        // ── utilitários determinísticos ───────────────────────────────────────
        const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        const norm = (s) => s.toLowerCase().replace(/[^a-zà-ú0-9%,]/g, "").replace(/^,+|,+$/g, "");
        const B = {}; D.blocos.forEach((b) => (B[b.id] = b.inicio));
        // instante em que a n-ésima ocorrência da palavra é DITA, procurando a partir do início do bloco
        function W(txt, bloco, n = 1) {
          const t0 = bloco ? B[bloco] - 0.06 : 0;
          let k = 0;
          for (const p of D.palavras) {
            if (p.s < t0) continue;
            if (norm(p.w) === norm(txt) && ++k === n) return p.s;
          }
          throw new Error("palavra não encontrada: " + txt + " (" + bloco + ")");
        }
        // stop-motion: o tempo anda em degraus de 12 qps, a curva continua a do ease base
        // Até 10/10/2026 o S() andava em degraus de 12 por segundo (cara de stop-motion). O Mickael pediu o movimento fluido
        // ("por mais que ela aconteça em blocos, as coisas têm que acontecer de uma maneira fluida… sem nada muito travado"):
        // agora é a curva inteira, a 24 quadros. O nome fica, para as cenas antigas montarem igual.
        function S(dur, base = "power2.out") {
          return gsap.parseEase(base);
        }
        // "fervura" do stop-motion: o papel treme algumas vezes por segundo, sorteio fixo
        function ferve(el, amp, seed, t0, t1, hz = 6) {
          const n = Math.max(1, Math.round((t1 - t0) * hz));
          tl.fromTo(el, { rotation: 0 }, {
            rotation: amp, duration: t1 - t0, immediateRender: false,
            ease: (t) => (t >= 1 ? 0 : rnd(seed * 977 + Math.floor(t * n)) * 2 - 1),
          }, t0);
        }
        function pRet(w, h, seed, j = 2.6, passo = 38) {
          const pts = [];
          const lado = (x0, y0, x1, y1, k) => {
            const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / passo));
            for (let i = 0; i < n; i++) {
              const t = i / n;
              pts.push([x0 + (x1 - x0) * t + (rnd(seed + k * 97 + i) - 0.5) * 2 * j,
                        y0 + (y1 - y0) * t + (rnd(seed + k * 53 + i + 7) - 0.5) * 2 * j]);
            }
          };
          lado(0, 0, w, 0, 1); lado(w, 0, w, h, 2); lado(w, h, 0, h, 3); lado(0, h, 0, 0, 4);
          return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
        }
        function pBolha(cx, cy, rx, ry, seed, j = 0.08, n = 22) {
          const pts = [];
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2, r = 1 + (rnd(seed + i * 31) - 0.5) * 2 * j;
            pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
          }
          return "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
        }
        const svg = (w, h, inner) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
        const fT = (x, y, t, s, cor = C.tinta, a = "middle") =>
          `<text x="${x}" y="${y}" text-anchor="${a}" font-family="Archivo Black" font-size="${s}" fill="${cor}">${t}</text>`;
        const fM = (x, y, t, s, cor = C.tinta, a = "start", op = 1) =>
          `<text x="${x}" y="${y}" text-anchor="${a}" font-family="IBM Plex Mono" font-weight="700" font-size="${s}" fill="${cor}" opacity="${op}">${t}</text>`;
        const ic = (x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;

        // ── objetos do mundo: cada cena guarda os seus para a fervura ─────────
        const fervura = {};   // cena → [objetos que fervem]
        let cenaAtual = 0;
        function obj(pai, id, x, y, w, h, inner, sombra = true, ferver = true) {
          const d = document.createElement("div");
          d.className = "o" + (sombra ? " som" : "");
          d.id = id;
          d.dataset.layoutAllowOverflow = "";
          d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; d.style.height = h + "px";
          d.innerHTML = `<div class="b">${inner.startsWith("<svg") ? inner : svg(w, h, inner)}</div>`;
          pai.appendChild(d);
          if (ferver) (fervura[cenaAtual] = fervura[cenaAtual] || []).push(d);
          return d;
        }
        function rotulo(pai, id, x, y, w, html, cls, css = "") {
          // carimbo: a máscara de grão só cobre a caixa do elemento, então ela ganha folga dos dois lados
          if (/selo|interro/.test(cls)) { x -= 220; w += 440; }
          const d = document.createElement("div");
          d.className = "o " + cls; d.id = id; d.dataset.layoutAllowOverflow = "";
          d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;${css}`;
          d.innerHTML = html;
          pai.appendChild(d);
          return d;
        }
        function grupo(pai, id, x, y, w, h) {
          const d = document.createElement("div");
          d.className = "o"; d.id = id; d.dataset.layoutAllowOverflow = "";
          d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
          pai.appendChild(d);
          return d;
        }
        const ST = [];
        function cena(i, x, y) {
          const c = document.createElement("div");
          c.className = "cena"; c.id = "c" + i; c.style.left = x + "px"; c.style.top = y + "px"; c.dataset.layoutAllowOverflow = "";
          mundo.appendChild(c);
          ST[i] = { x, y };
          cenaAtual = i;
          return c;
        }

        // ── movimentos ────────────────────────────────────────────────────────
        const aparece = (el, t, dur = 0.42, de = { scale: 0.4, y: 40 }) => {
          tl.set(el, { autoAlpha: 0 }, 0);
          tl.fromTo(el, Object.assign({ autoAlpha: 1, rotation: 0, x: 0 }, de),
            { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: 0, duration: dur, ease: S(dur, "back.out(1.8)"), immediateRender: false }, t);
        };
        const some = (el, t, dur = 0.3, para = { y: 60, scale: 0.6 }) =>
          tl.to(el, Object.assign({ autoAlpha: 0, duration: dur, ease: S(dur, "power2.in") }, para), t);
        function treme(t, amp = 16, dur = 0.32, seed = 1) {
          const n = Math.round(dur * 24);
          tl.fromTo("#tremor", { x: 0, y: 0 }, {
            x: amp, y: amp * 0.6, duration: dur, immediateRender: false,
            ease: (p) => (p >= 1 ? 0 : (rnd(seed + Math.floor(p * n)) * 2 - 1) * (1 - p)),
          }, t);
        }
        const carimba = (el, t, rot, big = 1, tremor = true) => {
          tl.set(el, { autoAlpha: 0 }, 0);
          tl.fromTo(el, { autoAlpha: 1, scale: 2.4 * big, rotation: rot - 8 }, { autoAlpha: 1, scale: 1, rotation: rot, duration: 0.18, ease: S(0.18, "power4.in"), immediateRender: false }, t - 0.12);
          if (tremor) treme(t + 0.06, 7 * big, 0.2, Math.round(t * 10));
        };
        // tinta que se desenha (traço que avança)
        function desenha(sel, t, dur, comp) {
          const el = document.querySelector(sel);
          el.style.strokeDasharray = comp + " " + comp;
          tl.set(el, { attr: { "stroke-dashoffset": comp } }, 0);
          tl.fromTo(el, { attr: { "stroke-dashoffset": comp } }, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: S(dur, "power1.inOut"), immediateRender: false }, t);
        }
        function revela(el, t, dur, de = "inset(100% 0% 0% 0%)") {
          tl.set(el, { clipPath: de }, 0);
          tl.fromTo(el, { clipPath: de }, { clipPath: "inset(0% 0% 0% 0%)", duration: dur, ease: S(dur, "power1.inOut"), immediateRender: false }, t);

        const cai = (el, t, dx, dy, rot, dur = 0.6) =>

            const amp = 0.45 + rnd(i * 50 + n) * 0.5, seed = i * 100 + n;
            if (i === 0 || i === 13) {
              ferve(el.firstChild, amp, seed, 0, B.linha + 1);
              ferve(el.firstChild, amp, seed + 7, B.fecho - 1, DUR);
            } else ferve(el.firstChild, amp, seed, Math.max(0, janela[i][0]), Math.min(DUR, janela[i][1]));
          });
        });

        // ── RAUL: enquadramento alternado por bloco, para a emenda virar "corte de câmera" ──
        D.blocos.forEach((b, i) => {
          const z = i % 2 ? 1.08 : 1.0;
          tl.fromTo("#raul-cam", { scale: z }, { scale: z + 0.03, duration: b.dur, ease: "none", immediateRender: false }, b.inicio);
        });

        // ── borda rasgada da folha (clip) e a fibra clara por baixo ────────────
        const pts = [], fib = [];
        for (let x = 0; x <= 1080; x += 9) {
          const y = 768 + Math.sin(x / 61) * 5 + Math.sin(x / 23 + 1) * 3 + (rnd(x + 5) - 0.5) * 9;
          pts.push([x, y]);
          fib.push([x, y + 5 + rnd(x + 77) * 7]);
        }
        const borda = pts.map((p) => p[0] + " " + p[1].toFixed(1)).join(" L");
        $("#topo").style.clipPath = `path("M0 0 L1080 0 L${borda.split(" L").reverse().join(" L")} Z")`;
        const fibra = (dy) => "M0 660 L1080 660 L" + fib.slice().reverse().map((p) => p[0] + " " + (p[1] + dy).toFixed(1)).join(" L") + " Z";
        $("#rasgo-fibra").setAttribute("d", fibra(0));
        $("#rasgo-sombra").setAttribute("d", fibra(14));

        // ── LEGENDA ───────────────────────────────────────────────────────────
        const leg = $("#leg");
        D.legenda.forEach((c, i) => {
          const e = document.createElement("div");
          e.className = "etq";
          const txt = c.palavras.map((p) => p.w).join(" ");
          e.style.fontSize = Math.min(92, Math.floor(930 / (txt.length * 0.74))) + "px";
          e.innerHTML = c.palavras.map((p) => `<span>${p.w}</span>`).join(" ");
          leg.appendChild(e);
          const rot = (rnd(i + 3000) - 0.5) * 5;
          tl.set(e, { xPercent: -50, yPercent: -50, autoAlpha: 0 }, 0);
          tl.fromTo(e, { autoAlpha: 1, scale: 0.72, rotation: rot * 2.2, y: 10 },
            { scale: 1, rotation: rot, y: 0, duration: 0.14, ease: "back.out(2.4)", immediateRender: false }, c.ini);
          tl.set(e, { autoAlpha: 0 }, c.fim);
          const spans = e.querySelectorAll("span");
          c.palavras.forEach((p, k) => {
            tl.set(spans[k], { color: C.tinta, scale: 1 }, 0);
            tl.set(spans[k], { color: C.verm, scale: 1 + 0.36 / Math.max(6, p.w.length) }, Math.max(c.ini, p.s - 0.03));
            if (k + 1 < c.palavras.length) tl.set(spans[k], { color: C.tinta, scale: 1 }, c.palavras[k + 1].s - 0.03);
          });
        });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
